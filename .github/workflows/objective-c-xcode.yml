name: Xcode - Build and Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-analyze:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Find project
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -type d -name "fm.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: fm.xcodeproj was not found."
            find . -name "*.xcodeproj" -print
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT"

      - name: Verify scheme
        run: |
          xcodebuild -list -project "$PROJECT"

      - name: Build
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme fm \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme fm \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            analyze
```
