name: RaceTrian iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Test RaceTrian
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(find /Applications \
            -maxdepth 1 -name 'Xcode*.app' \
            | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Check project
        run: |
          ls -la
          xcodebuild -list -project RaceTrian.xcodeproj

      - name: Build and Test
        run: |
          xcodebuild test \
            -project RaceTrian.xcodeproj \
            -scheme RaceTrian \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
