
name: RaceTrian iOS Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build, Test and Upload
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build and Test
        run: |
          xcodebuild test \
            -project RaceTrian.xcodeproj \
            -scheme RaceTrian \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Apple Distribution Certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$PROFILE_BASE64" | base64 -D \
            > "$RUNNER_TEMP/profile.mobileprovision"

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c 'Print :Name' "$RUNNER_TEMP/profile.plist")

          TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Install App Store Connect API Key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s' "$API_KEY_BASE64" | base64 -D \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Create iOS Archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          xcodebuild archive \
            -project RaceTrian.xcodeproj \
            -scheme RaceTrian \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RaceTrian.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="com.RaceTrian.RaceTrian" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Export IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.RaceTrian.RaceTrian</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RaceTrian.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "IPA file was not created."
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          mkdir -p "$API_PRIVATE_KEYS_DIR"

          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" \
            "$API_PRIVATE_KEYS_DIR/AuthKey_${API_KEY_ID}.p8"

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID"
